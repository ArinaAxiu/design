<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лид-магниты</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Арина Аксютичева — графический и веб-дизайнер. Портфолио: кейсы SUPERPET, LAIKY, Clarins.">
<script src="vendor/react.js"></script>
<script src="support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;700;900&amp;family=Montserrat:wght@700&amp;display=swap" rel="stylesheet">
<style>
p,li,figcaption,h1,h2,h3,h4,blockquote,dd,td{text-wrap:pretty}

body{margin:0;background:#E9EEF6}
a:focus-visible,button:focus-visible{outline:3px solid #FF8A00;outline-offset:3px;border-radius:10px}
button{font:inherit;color:inherit;cursor:pointer}
.sb{font-family:Montserrat,sans-serif;font-weight:700;font-size:16px;padding:12px 20px;min-height:48px;border-radius:999px;border:1.5px solid #D8DCE6;background:#fff;color:#4A4A55;transition:background .2s,border-color .2s,color .2s}
.sb:hover{border-color:#E80F71}
.sb.on{border-color:#E80F71;background:#FFE2EF;color:#C40B5E}
.pn{background:#fff;border-radius:28px;padding:40px;display:flex;flex-direction:column;gap:32px;box-shadow:0 18px 40px -16px rgba(15,26,43,.18)}
.top{display:flex;gap:48px;align-items:center}
.vw{position:relative;flex:none;width:min(520px,100%);border-radius:18px;overflow:hidden;background:#F0F2F6;box-shadow:0 10px 30px -12px rgba(15,26,43,.35)}
.im{display:block;width:100%;background-repeat:no-repeat}
.tap{position:absolute;top:0;bottom:0;width:50%;background:none;border:0}
.tap.l{left:0}.tap.r{right:0}
.inf{display:flex;flex-direction:column;gap:18px;min-width:0}
.br{align-self:flex-start;font-weight:700;font-size:14px;color:#E80F71;background:#FFE2EF;border-radius:999px;padding:6px 12px}
.inf h2{margin:0;font-weight:900;font-size:clamp(26px,3vw,38px);line-height:1.1;letter-spacing:-0.01em;text-wrap:balance}
.inf p{margin:0;font-size:18px;line-height:1.5;color:#2D3748;max-width:520px}
.ctl{display:flex;align-items:center;gap:14px;margin-top:6px}
.nv{width:52px;height:52px;border-radius:50%;border:1.5px solid #D8DCE6;background:#fff;color:#0F1A2B;display:flex;align-items:center;justify-content:center;transition:border-color .2s,background .2s}
.nv:hover{border-color:#E80F71}
.nv[disabled]{opacity:.35;cursor:default}
.ct{font-weight:700;font-size:16px;color:#4A5568;min-width:120px;text-align:center}
.th{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.tb{padding:0;border:0;border-radius:10px;overflow:hidden;background:#F0F2F6;outline:2px solid transparent;outline-offset:2px;transition:outline-color .2s,opacity .2s;opacity:.72}
.tb:hover{opacity:1}
.tb.on{outline-color:#E80F71;opacity:1}
@media (max-width: 860px){
.pn{padding:20px;border-radius:22px;gap:22px}
.top{flex-direction:column;gap:22px;align-items:stretch}
.vw{width:100%}
.inf p{font-size:16px}
.th{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
}
</style>
</helmet>
<div style="background: #E9EEF6; color: #0F1A2B; font-family: 'Golos Text', system-ui, sans-serif; min-height: 100vh">
<nav style="position: sticky; top: 0; z-index: 10; background: rgba(233,238,246,.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid rgba(15,26,43,.08)"><div style="max-width: 1240px; margin: 0 auto; padding: 8px 24px; box-sizing: border-box">
<a href="index.html#works" style="display: inline-flex; align-items: center; gap: 8px; color: #0F1A2B; background: #fff; text-decoration: none; font-weight: 700; font-size: 16px; padding: 10px 16px; border-radius: 12px; min-height: 44px; box-sizing: border-box"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: -3px"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg> К&nbsp;проектам</a>
</div></nav>
<div style="max-width: 1240px; margin: 0 auto; padding: 22px 24px 80px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px">

<header style="display: flex; flex-direction: column; gap: 16px">
<span style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap"><img src="assets/89f64917f158.svg" alt="SUPERPET / LAIKY" width="165" height="19" style="display: block; height: 19px; width: auto"></span>
<h1 style="margin: 0; font-weight: 900; font-size: clamp(36px, 5vw, 64px); line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance">Лид-магниты</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.5; max-width: 700px">Гайды и&nbsp;чек-листы, которые читатель получает бесплатно. Внутри&nbsp;— польза от&nbsp;ветеринаров, в&nbsp;конце&nbsp;— мягкий переход к&nbsp;продукту и&nbsp;промокод.</p>
</header>

<div style="position: sticky; top: 61px; z-index: 9; margin: -12px -24px; padding: 12px 24px; background: rgba(233,238,246,.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 14px">
<span style="font-weight: 700; font-size: 17px">Гайды</span>
<div role="tablist" aria-label="Гайды" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
<button type="button" role="tab" class="{{tab.cls}}" aria-selected="{{tab.on}}" onClick="{{tab.pick}}">{{tab.label}}</button>
</sc-for>
</div>
</div>

<section class="pn" aria-label="{{title}}">
<div class="top">
<div class="vw" style="aspect-ratio: {{ar}}">
<span class="im" role="img" aria-label="{{alt}}" style="height: 100%; background-image: url('{{u}}'); background-size: {{sz}}% 100%; background-position: {{px}}% 0"></span>
<button type="button" class="tap l" onClick="{{prev}}" aria-label="Предыдущий слайд"></button>
<button type="button" class="tap r" onClick="{{next}}" aria-label="Следующий слайд"></button>
</div>
<div class="inf">
<span class="br">{{brand}}</span>
<h2>{{title}}</h2>
<p>{{desc}}</p>
<div class="ctl">
<button type="button" class="nv" onClick="{{prev}}" disabled="{{first}}" aria-label="Предыдущий слайд"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<span class="ct" aria-live="polite">{{count}}</span>
<button type="button" class="nv" onClick="{{next}}" disabled="{{last}}" aria-label="Следующий слайд"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</div>
</div>
<div class="th">
<sc-for list="{{thumbs}}" as="t" hint-placeholder-count="11">
<button type="button" class="{{t.cls}}" onClick="{{t.pick}}" aria-label="{{t.label}}" style="aspect-ratio: {{ar}}"><span class="im" style="height: 100%; background-image: url('{{u}}'); background-size: {{sz}}% 100%; background-position: {{t.px}}% 0"></span></button>
</sc-for>
</div>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
const G = [{"k": "sp", "tab": "Долголетие кошки", "brand": "SUPERPET", "u": "assets/020322f5d23a.webp", "ar": "4 / 5", "t": "Что поможет вашей кошке прожить больше 15 лет", "d": "Гайд от ветеринара-гастроэнтеролога: пять факторов долголетия, признаки того, что питание не подходит, и три простых шага в конце.", "n": 11}, {"k": "lk", "tab": "Питание собаки", "brand": "LAIKY", "u": "assets/993ed27f559c.webp", "ar": "4 / 5", "t": "Признаки, что питание собаке не подходит", "d": "10 сигналов организма, которые нельзя игнорировать, и что делать, если совпало. Тот же каркас, что у кошачьего гайда, но в фирменном стиле LAIKY.", "n": 15}, {"k": "teeth", "tab": "Зубы", "brand": "SUPERPET × LAIKY", "u": "assets/e9cce42d3410.webp", "ar": "4 / 5", "t": "10 признаков, что у питомца болят зубы", "d": "Чек-лист от ветеринарного стоматолога — общий для кошек и собак. В финале читатель сам выбирает бренд: SUPERPET или LAIKY.", "n": 11}, {"k": "hab", "tab": "15 привычек кошек", "brand": "SUPERPET", "u": "assets/3ccedbd2680f.webp", "ar": "2 / 3", "t": "Почему кошка делает это? 15 привычек, которые владельцы понимают неправильно", "d": "Каждая привычка разобрана в два столбика: что думает человек и что это значит на самом деле. Иллюстрации в одном стиле, в конце — подарок с промокодом.", "n": 11}];
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { g: 0, s: 0 }; }
  go(d) { const n = G[this.state.g].n; this.setState((st) => ({ s: Math.max(0, Math.min(n - 1, st.s + d)) })); }
  renderVals() {
    const { g, s } = this.state, c = G[g], pos = (i) => c.n > 1 ? i / (c.n - 1) * 100 : 0;
    return {
      tabs: G.map((x, i) => ({ label: x.tab, on: i === g ? 'true' : 'false', cls: 'sb' + (i === g ? ' on' : ''), pick: () => this.setState({ g: i, s: 0 }) })),
      title: c.t, desc: c.d, brand: c.brand, u: c.u, ar: c.ar, sz: c.n * 100, px: pos(s),
      alt: c.t + ', слайд ' + (s + 1) + ' из ' + c.n, count: 'Слайд ' + (s + 1) + ' из ' + c.n,
      first: s === 0, last: s === c.n - 1, prev: () => this.go(-1), next: () => this.go(1),
      thumbs: Array.from({ length: c.n }, (_, i) => ({ px: pos(i), cls: 'tb' + (i === s ? ' on' : ''), label: 'Слайд ' + (i + 1), pick: () => this.setState({ s: i }) }))
    };
  }
}
</script>
</body>
</html>
