<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Портфолио Арины</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&amp;family=Onest:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#141414;font:17px/1.5 'Onest',system-ui,sans-serif;padding:24px;box-sizing:border-box}
main{max-width:560px;width:100%;display:flex;flex-direction:column;gap:28px}
h1{margin:0;font-family:'Unbounded',sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(28px,6vw,44px);line-height:1;letter-spacing:-0.02em}
a{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border:2px solid #141414;border-radius:16px;color:#141414;text-decoration:none;font-weight:700;font-size:19px}
a:hover,a:focus-visible{background:#141414;color:#fff;outline:none}
p{margin:0;color:#4a4a4a}
</style>
</head>
<body>
<main>
<h1>Портфолио Арины</h1>
<p>Два варианта главной страницы. Какой лучше?</p>
<a href="v1/">Вариант 1 <span aria-hidden="true">→</span></a>
<a href="v2/">Вариант 2 <span aria-hidden="true">→</span></a>
</main>
</body>
</html>
